name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nodeharvest
          POSTGRES_USER: nodeharvest
          POSTGRES_PASSWORD: integration
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nodeharvest"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          dir --redact --no-banner .
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: PostgreSQL and Redis integration
        env:
          NODE_HARVEST_TEST_POSTGRES: postgres://nodeharvest:integration@127.0.0.1:5432/nodeharvest?sslmode=disable
          NODE_HARVEST_TEST_REDIS: redis://127.0.0.1:6379/0
        run: go test -tags=integration ./internal/db ./internal/hotcache
      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/nodeharvest-server ./cmd/server
          CGO_ENABLED=0 go build -trimpath -o dist/nodeharvest-worker ./cmd/worker
          CGO_ENABLED=0 go build -trimpath -o dist/nodeharvest-migrate ./cmd/migrate
          CGO_ENABLED=0 go build -trimpath -o dist/nodeharvest ./cmd/nodeharvest
      - uses: Azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.20.2
      - name: Helm validation
        run: |
          helm lint deploy/helm/nodeharvest
          helm template nodeharvest deploy/helm/nodeharvest \
            --values deploy/helm/nodeharvest/values-staging.yaml >/dev/null
          helm template nodeharvest deploy/helm/nodeharvest \
            --values deploy/helm/nodeharvest/values-prod.yaml >/dev/null
      - name: Workflow validation
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Frontend
        working-directory: web
        run: |
          npm ci
          npm run lint
          STATIC_EXPORT=1 npm run build
          mkdir -p ../dist/web
          cp -a out/. ../dist/web/
          npm audit --omit=dev --audit-level=high
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./cmd/... ./internal/...
      - name: Static security scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -exclude-generated ./cmd/... ./internal/...
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/nodeharvest.spdx.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nodeharvest-${{ github.sha }}
          path: |
            dist/
            coverage.out
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: nodeharvest:ci
      - name: Image vulnerability scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: nodeharvest:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Container smoke
        env:
          SUB_TOKEN: ci-subscription-token-change-me
        run: |
          docker run -d --name nodeharvest-smoke -p 127.0.0.1:18080:8080 \
            -e NODE_HARVEST_TOKEN="$SUB_TOKEN" \
            -e NODE_HARVEST_ADMIN_TOKEN=ci-admin-token-change-me \
            -e NODE_HARVEST_SESSION_SECRET=ci-session-secret-change-me-32bytes \
            -e NODE_HARVEST_SCHEDULE=0 \
            nodeharvest:ci
          trap 'docker rm -f nodeharvest-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs nodeharvest-smoke
              exit 1
            fi
            sleep 2
          done
          BASE_URL=http://127.0.0.1:18080 SUB_TOKEN="$SUB_TOKEN" bash deploy/smoke.sh

  staging-smoke:
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Smoke configured staging
        if: vars.STAGING_URL != ''
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
          SUB_TOKEN: ${{ secrets.STAGING_SUB_TOKEN }}
        run: bash deploy/smoke.sh
