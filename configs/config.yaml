# node-hunter 配置文件
# 采集 / 解析 / 测试 / 清理 / 筛选 代理节点
# 订阅源已按 2026-07 实测可用性扩充；失效源请 enabled: false 或替换 URL
# 维护：configs/sources_catalog.md

app:
  concurrency: 64
  fetch_timeout_sec: 25
  test_timeout_sec: 6
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

