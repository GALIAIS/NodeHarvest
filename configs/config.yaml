protocols:
  - vmess
  - vless
  - trojan
  - ss
  - ssr
  - hysteria2
  - hy2
  - tuic

filter:
  max_latency_ms: 2500
  min_success: true
  drop_invalid: true
  prefer_tls: false
  max_nodes: 500
  sort_by: score
  min_score: 70
  prune_after_quality: true
  max_store_nodes: 8000

export:
  dir: "output"
  formats:
    - raw
    - base64
    - clash
    - json
  filename_prefix: "nodes"


# 定时任务：VPS 上建议 enabled: true
# 环境变量 NODE_HUNTER_SCHEDULE=1 可强制开启
schedule:
  enabled: true
  interval_min: 180          # 每 3 小时
  job: full                  # full | fetch | quality
  run_on_start: false        # 启动立刻跑一轮（调试可 true）
  skip_ai: true              # 定时全流程跳过 AI，更快
  max_test: 1200
  rounds: 2
  jitter_sec: 45

# 对外订阅发布（其他用户远程拉取）
# TOKEN 可用环境变量 NODE_HUNTER_TOKEN 覆盖；PUBLIC_URL 用 NODE_HUNTER_PUBLIC_URL
publish:
  enabled: true
  token: ""                  # 建议生产设置随机串，客户端 ?token=xxx
  path_prefix: "/sub"
  min_score: 70
  max_nodes: 500
  alive_only: true
  formats:
    - raw
    - base64
    - clash
  cache_sec: 120
  pre_render: true
  max_countries: 30
  public_url: ""             # 例: https://sub.example.com


# IP 国家标注（GeoLite2-Country + 名称启发）
geo:
  enabled: true
  db_path: "data/GeoLite2-Country.mmdb"
  auto_download: true
  download_url: ""           # 空=内置 P3TERX 镜像
  annotate_after_quality: true
  rename_with_flag: true


# 企业安全 / 限流

# 真实协议拨测（需安装 sing-box）
dial:
  enabled: true
  bin: "/opt/node-hunter/bin/sing-box"  # 空=PATH 自动查找；本地可改 PATH
  engine: sing-box
  concurrency: 4
  timeout_sec: 18
  test_url: "https://www.cloudflare.com/cdn-cgi/trace"
  max_nodes: 100
  after_quality: true        # true 则 full/quality 后自动真测 TopN
  after_quality_max: 60

security:
  admin_token: ""            # 空则管理 API 使用 publish.token / NODE_HUNTER_TOKEN
  allow_query_token: true
  sub_rps: 20
  sub_burst: 40
  api_rps: 30
  api_burst: 60

server:
  read_header_timeout_sec: 10
  shutdown_timeout_sec: 30
  enable_metrics: true
  enable_pprof: false

sqlite:
  enabled: true
  path: "data/node-hunter.db"

logging:
  level: info
