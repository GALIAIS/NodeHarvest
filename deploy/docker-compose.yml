services:
  nodeharvest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nodeharvest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # 开启定时（也可在 config.yaml schedule.enabled）
      NODE_HARVEST_SCHEDULE: "1"
      # 订阅访问令牌（强烈建议修改）
      NODE_HARVEST_TOKEN: "${NODE_HARVEST_TOKEN:?set NODE_HARVEST_TOKEN}"
      # 控制台只接受账号密码登录；bcrypt hash 不要写进配置文件或仓库
      NODE_HARVEST_LOCAL_AUTH: "1"
      NODE_HARVEST_BOOTSTRAP_PASSWORD_HASH: "${NODE_HARVEST_BOOTSTRAP_PASSWORD_HASH:?set NODE_HARVEST_BOOTSTRAP_PASSWORD_HASH}"
      NODE_HARVEST_SESSION_SECRET: "${NODE_HARVEST_SESSION_SECRET:?set NODE_HARVEST_SESSION_SECRET}"
      # 对外域名，用于 /sub 返回的完整链接
      NODE_HARVEST_PUBLIC_URL: "${NODE_HARVEST_PUBLIC_URL:-http://127.0.0.1:8080}"
      NODE_HARVEST_SINGBOX: "/app/bin/sing-box"
      NODE_HARVEST_MIHOMO: "/app/bin/mihomo"
      # 可选：AI 真实代理探测
      # NODE_HARVEST_SOCKS5: "127.0.0.1:1080"
      TZ: Asia/Shanghai
    volumes:
      - nh-data:/app/data
      - nh-output:/app/output
      - ../configs/config.yaml:/app/configs/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # 可选：Caddy 自动 HTTPS 反代
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #   depends_on:
  #     - nodeharvest

volumes:
  nh-data:
  nh-output:
  # caddy-data:
