{{- if and (not .Values.config.existingConfigMap) .Values.config.inline }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nodeharvest.configMapName" . }}
  labels:
    {{- include "nodeharvest.labels" . | nindent 4 }}
data:
  config.yaml: |
{{ .Values.config.inline | indent 4 }}
{{- end }}
