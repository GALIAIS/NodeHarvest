global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: nodeharvest
    metrics_path: /metrics
    static_configs:
      - targets: [nodeharvest:8080]
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: [http://nodeharvest:8080/api/ready]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115
