openapi: 3.1.0
info:
  title: NodeHarvest API
  version: 3.0.0
  description: |
    Control-plane, inventory, workflow, governance, and subscription API.
    Management endpoints accept only an HttpOnly session cookie created by local
    account/password login. Subscription endpoints use Bearer or X-Sub-Token.
    The subscription surface is also mounted at `/api/sub` and may be mounted at
    one additional operator-configured path prefix.
servers:
  - url: /
security:
  - sessionCookie: []
tags:
  - name: Status
  - name: Auth
  - name: Inventory
  - name: Jobs
  - name: Sources
  - name: Distribution
  - name: Administration
  - name: Subscription
  - name: Integrations
paths:
  /api/health:
    get:
      tags: [Status]
      summary: Liveness and dependency status
      security: []
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
  /api/ready:
    get:
      tags: [Status]
      summary: Serving readiness
      security: []
      responses:
        "200": {$ref: "#/components/responses/JSON"}
        "503": {$ref: "#/components/responses/Error"}
  /api/version:
    get:
      tags: [Status]
      summary: Build and runtime version
      security: []
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/terms:
    get:
      tags: [Status]
      summary: Acceptable-use policy
      security: []
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Create a local account session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant, username, password]
              properties:
                tenant: {type: string, default: default}
                username: {type: string}
                password: {type: string, format: password}
      responses:
        "200":
          description: Authenticated; also sets the session cookie
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Clear the session cookie
      security: []
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Inspect the current local-account session
      security: []
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
  /api/v1/integrations/sub-store/session-check:
    get:
      tags: [Integrations]
      summary: Caddy authentication hook for the Sub-Store management surface
      description: Requires an operator or admin session and returns no response body.
      responses:
        "204": {description: Session accepted}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /api/v1/integrations/sub-store/publish-check:
    get:
      tags: [Integrations]
      summary: Caddy authentication hook for Sub-Store share and download routes
      description: |
        Accepts an operator/admin session or a subscription credential. Caddy supplies
        the original route in X-Forwarded-Uri; URL-only clients use the `nh_token`
        parameter, which is removed before proxying upstream.
      security:
        - sessionCookie: []
        - bearerSubscription: []
        - subscriptionToken: []
      parameters:
        - {name: X-Forwarded-Uri, in: header, required: true, schema: {type: string}}
        - {name: X-Forwarded-Method, in: header, schema: {type: string, enum: [GET, HEAD]}}
      responses:
        "204": {description: Request accepted}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "405": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /api/public/dashboard:
    get:
      tags: [Status]
      summary: Safe anonymous dashboard snapshot
      security: []
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/public/dashboard/events:
    get:
      tags: [Status]
      summary: Server-sent anonymous dashboard updates
      security: []
      responses:
        "200":
          description: event-stream with `dashboard` events
          content:
            text/event-stream: {schema: {type: string}}
  /api/v1/events:
    get:
      tags: [Status]
      summary: Authenticated server-sent refresh events
      responses:
        "200":
          description: event-stream with `dashboard` and `refresh` events
          content:
            text/event-stream: {schema: {type: string}}
        "401": {$ref: "#/components/responses/Error"}
  /api/stats:
    get:
      tags: [Inventory]
      summary: Current node and quality aggregates
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/stats/trends:
    get:
      tags: [Inventory]
      summary: Daily node-quality aggregates
      parameters:
        - {$ref: "#/components/parameters/Days"}
      responses:
        "200":
          description: Daily metrics
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/DailyMetric"}
  /api/nodes:
    get:
      tags: [Inventory]
      summary: Search and cursor-page nodes
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - {name: q, in: query, schema: {type: string}}
        - {name: protocol, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: grade, in: query, schema: {type: string}}
        - {name: country, in: query, schema: {type: string, minLength: 2, maxLength: 2}}
        - {name: min_score, in: query, schema: {type: number, minimum: 0, maximum: 100}}
        - {name: alive, in: query, schema: {type: boolean}}
        - {name: hq, in: query, schema: {type: boolean}}
        - {name: verified, in: query, schema: {type: boolean}}
        - {name: ai, in: query, schema: {type: string}}
      responses:
        "200":
          description: Node page; credentials are redacted unless an admin is authenticated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NodePage"}
        "400": {$ref: "#/components/responses/Error"}
  /api/nodes/{id}:
    get:
      tags: [Inventory]
      summary: Get a node
      parameters:
        - {$ref: "#/components/parameters/ID"}
      responses:
        "200":
          description: Node
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Node"}
        "404": {$ref: "#/components/responses/Error"}
  /api/nodes/{id}/metrics:
    get:
      tags: [Inventory]
      summary: Daily metrics for one node
      parameters:
        - {$ref: "#/components/parameters/ID"}
        - {$ref: "#/components/parameters/Days"}
      responses:
        "200":
          description: Daily metrics
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/DailyMetric"}
  /api/jobs:
    get:
      tags: [Jobs]
      summary: Cursor-page tenant jobs
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: Job page
          content:
            application/json:
              schema:
                type: object
                required: [jobs, count, has_more]
                properties:
                  jobs: {type: array, items: {$ref: "#/components/schemas/Job"}}
                  count: {type: integer}
                  next_cursor: {type: string}
                  has_more: {type: boolean}
        "401": {$ref: "#/components/responses/Error"}
  /api/jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get a tenant job
      parameters:
        - {$ref: "#/components/parameters/ID"}
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        "404": {$ref: "#/components/responses/Error"}
  /api/jobs/{id}/events:
    get:
      tags: [Jobs]
      summary: Poll append-only job events
      parameters:
        - {$ref: "#/components/parameters/ID"}
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        "200":
          description: Ordered events
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/JobEvent"}
  /api/jobs/fetch:
    $ref: "#/components/pathItems/StartJob"
  /api/jobs/quality:
    $ref: "#/components/pathItems/StartJob"
  /api/jobs/ai:
    $ref: "#/components/pathItems/StartJob"
  /api/jobs/full:
    $ref: "#/components/pathItems/StartJob"
  /api/jobs/geo:
    $ref: "#/components/pathItems/StartJob"
  /api/jobs/dial:
    $ref: "#/components/pathItems/StartJob"
  /api/jobs/purity:
    $ref: "#/components/pathItems/StartJob"
  /api/jobs/cancel:
    post:
      tags: [Jobs]
      summary: Cancel the active in-process job
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/dial/status:
    get:
      tags: [Jobs]
      summary: Real-protocol dialer capability and settings
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/purity/summary:
    get:
      tags: [Inventory]
      summary: Exit-IP purity summary
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/countries:
    get:
      tags: [Inventory]
      summary: Country aggregates
      parameters:
        - {name: alive, in: query, schema: {type: boolean}}
        - {name: hq, in: query, schema: {type: boolean}}
        - {name: protocol, in: query, schema: {type: string}}
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/sources:
    get:
      tags: [Sources]
      summary: Configured sources with health and contribution
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - name: sort
          in: query
          schema: {type: string, enum: [priority, health, contribution, success], default: priority}
      responses:
        "200":
          description: Legacy array, or a cursor-page object when `page=1`.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Source"}
        "400": {$ref: "#/components/responses/Error"}
  /api/ai/targets:
    get:
      tags: [Inventory]
      summary: Configured AI reachability targets
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/ai/host:
    get:
      tags: [Inventory]
      summary: Host reachability results
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/export/raw:
    $ref: "#/components/pathItems/AdminExport"
  /api/export/base64:
    $ref: "#/components/pathItems/AdminExport"
  /api/export/clash:
    $ref: "#/components/pathItems/AdminExport"
  /api/config:
    get:
      tags: [Status]
      summary: Redacted effective configuration
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/schedule:
    get:
      tags: [Status]
      summary: Scheduler status and next run
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/pools:
    get:
      tags: [Distribution]
      summary: Smart pool definitions, counts, and URLs
      responses:
        "200":
          description: Pools
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Pool"}
  /api/pools/{key}/export/raw:
    get:
      tags: [Distribution]
      summary: Export one smart pool as raw URIs
      parameters:
        - {$ref: "#/components/parameters/PoolKey"}
      responses:
        "200": {description: Raw URI list, content: {text/plain: {schema: {type: string}}}}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/tokens:
    get:
      tags: [Administration]
      summary: List tenant subscription credentials and today's usage
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: Legacy array, or a cursor-page object when `page=1`; hashes and plaintext are omitted.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Token"}}
    post:
      tags: [Administration]
      summary: Create a tenant subscription credential
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateToken"}
      responses:
        "200":
          description: Created token; plaintext is returned only in this response
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        "400": {$ref: "#/components/responses/Error"}
  /api/admin/tokens/{id}:
    delete:
      tags: [Administration]
      summary: Permanently revoke a token
      parameters:
        - {$ref: "#/components/parameters/ID"}
      responses:
        "200": {$ref: "#/components/responses/JSON"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/tokens/{id}/enable:
    $ref: "#/components/pathItems/TokenState"
  /api/admin/tokens/{id}/disable:
    $ref: "#/components/pathItems/TokenState"
  /api/admin/audit:
    get:
      tags: [Administration]
      summary: Query tenant audit entries
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - {name: from, in: query, schema: {oneOf: [{type: string, format: date}, {type: string, format: date-time}]}}
        - {name: to, in: query, schema: {oneOf: [{type: string, format: date}, {type: string, format: date-time}]}}
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Audit"}}
        "400": {$ref: "#/components/responses/Error"}
  /api/admin/publish/refresh:
    post:
      tags: [Administration]
      summary: Re-render and publish subscription artifacts
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/admin/sources/{name}/enable:
    $ref: "#/components/pathItems/SourceState"
  /api/admin/sources/{name}/disable:
    $ref: "#/components/pathItems/SourceState"
  /api/admin/sources/{name}/probe:
    post:
      tags: [Sources]
      summary: Fetch and evaluate one source
      parameters:
        - {$ref: "#/components/parameters/SourceName"}
      responses:
        "200": {$ref: "#/components/responses/JSON"}
        "502": {$ref: "#/components/responses/JSON"}
  /api/admin/tasks:
    get:
      tags: [Jobs]
      summary: List tenant durable queue tasks
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - {name: status, in: query, schema: {type: string, enum: [queued, running, completed, failed, dead, canceled]}}
      responses:
        "200":
          description: Queue tasks with internal options redacted
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Task"}}
  /api/admin/tasks/{id}/cancel:
    post:
      tags: [Jobs]
      summary: Cancel a queued or running tenant task
      parameters:
        - {$ref: "#/components/parameters/ID"}
      responses:
        "200": {$ref: "#/components/responses/JSON"}
        "404": {$ref: "#/components/responses/Error"}
  /api/admin/queue:
    get:
      tags: [Jobs]
      summary: Durable queue state counters
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/admin/users:
    get:
      tags: [Administration]
      summary: List users in the current tenant
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/User"}}
    post:
      tags: [Administration]
      summary: Create a local user in the current tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: {type: string}
                email: {type: string, format: email}
                password: {type: string, format: password, minLength: 12}
                role: {type: string, enum: [viewer, operator, admin]}
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "409": {$ref: "#/components/responses/Error"}
  /api/admin/users/{id}/enable:
    $ref: "#/components/pathItems/UserState"
  /api/admin/users/{id}/disable:
    $ref: "#/components/pathItems/UserState"
  /api/admin/config:
    patch:
      tags: [Administration]
      summary: Confirm and apply runtime-safe configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RuntimePatch"}
      responses:
        "200": {$ref: "#/components/responses/JSON"}
        "400": {$ref: "#/components/responses/Error"}
  /api/admin/config/versions:
    get:
      tags: [Administration]
      summary: List confirmed runtime configuration versions
      parameters:
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200": {$ref: "#/components/responses/JSON"}
  /api/admin/alerts:
    get:
      tags: [Administration]
      summary: List system anomaly alerts
      parameters:
        - {$ref: "#/components/parameters/Page"}
        - {name: active, in: query, schema: {type: boolean, default: true}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Alert"}}
  /api/admin/alerts/{id}/acknowledge:
    $ref: "#/components/pathItems/AlertState"
  /api/admin/alerts/{id}/resolve:
    $ref: "#/components/pathItems/AlertState"
  /sub:
    get:
      tags: [Subscription]
      summary: Subscription endpoint index
      security:
        - bearerSubscription: []
        - subscriptionToken: []
        - queryToken: []
      responses:
        "200": {$ref: "#/components/responses/JSON"}
        "401": {$ref: "#/components/responses/Error"}
  /metrics:
    get:
      tags: [Status]
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema: {type: string}
  /sub/{format}:
    get:
      tags: [Subscription]
      summary: Get the global subscription artifact
      security:
        - bearerSubscription: []
        - subscriptionToken: []
        - queryToken: []
      parameters:
        - {$ref: "#/components/parameters/GlobalFormat"}
      responses:
        "200": {description: Subscription artifact}
        "304": {description: ETag unchanged}
        "401": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /sub/pool/{key}/{format}:
    get:
      tags: [Subscription]
      summary: Get a smart-pool subscription artifact
      security:
        - bearerSubscription: []
        - subscriptionToken: []
        - queryToken: []
      parameters:
        - {$ref: "#/components/parameters/PoolKey"}
        - {$ref: "#/components/parameters/SubscriptionFormat"}
      responses:
        "200": {description: Subscription artifact}
        "404": {$ref: "#/components/responses/Error"}
  /sub/country/{code}/{format}:
    get:
      tags: [Subscription]
      summary: Get a country-partitioned subscription artifact
      security:
        - bearerSubscription: []
        - subscriptionToken: []
        - queryToken: []
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, minLength: 2, maxLength: 2}}
        - {$ref: "#/components/parameters/SubscriptionFormat"}
      responses:
        "200": {description: Subscription artifact}
        "403": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nh_session
    bearerSubscription:
      type: http
      scheme: bearer
    subscriptionToken:
      type: apiKey
      in: header
      name: X-Sub-Token
    queryToken:
      type: apiKey
      in: query
      name: token
      description: Disabled by default; enable only for clients that cannot send headers.
  parameters:
    ID: {name: id, in: path, required: true, schema: {type: string}}
    PoolKey: {name: key, in: path, required: true, schema: {type: string}}
    SourceName: {name: name, in: path, required: true, schema: {type: string}}
    GlobalFormat: {name: format, in: path, required: true, schema: {type: string, enum: [raw, base64, clash, clash.yaml, meta]}}
    SubscriptionFormat: {name: format, in: path, required: true, schema: {type: string, enum: [raw, base64, clash, clash.yaml]}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Page: {name: page, in: query, schema: {type: integer, enum: [1]}, description: Return the paginated response envelope.}
    Days: {name: days, in: query, schema: {type: integer, minimum: 1, maximum: 365, default: 30}}
  responses:
    JSON:
      description: JSON response
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    Error:
      description: Plain-text error
      content:
        text/plain:
          schema: {type: string}
  pathItems:
    StartJob:
      post:
        tags: [Jobs]
        summary: Enqueue a job
        requestBody:
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        responses:
          "200":
            description: Created job
            content:
              application/json:
                schema: {$ref: "#/components/schemas/Job"}
          "401": {$ref: "#/components/responses/Error"}
          "403": {$ref: "#/components/responses/Error"}
          "409": {$ref: "#/components/responses/Error"}
    AdminExport:
      get:
        tags: [Distribution]
        summary: Build an authenticated ad-hoc export
        parameters:
          - {$ref: "#/components/parameters/Limit"}
          - {name: min_score, in: query, schema: {type: number, minimum: 0, maximum: 100}}
          - {name: alive, in: query, schema: {type: boolean}}
          - {name: hq, in: query, schema: {type: boolean}}
          - {name: country, in: query, schema: {type: string}}
          - {name: protocol, in: query, schema: {type: string}}
          - {name: ai, in: query, schema: {type: string}}
        responses:
          "200": {description: Export artifact}
          "401": {$ref: "#/components/responses/Error"}
    TokenState:
      post:
        tags: [Administration]
        summary: Change token enabled state
        parameters:
          - {$ref: "#/components/parameters/ID"}
        responses:
          "200": {$ref: "#/components/responses/JSON"}
          "404": {$ref: "#/components/responses/Error"}
    SourceState:
      post:
        tags: [Sources]
        summary: Change source manual state
        parameters:
          - {$ref: "#/components/parameters/SourceName"}
        responses:
          "200": {$ref: "#/components/responses/JSON"}
          "400": {$ref: "#/components/responses/Error"}
    UserState:
      post:
        tags: [Administration]
        summary: Change user enabled state
        parameters:
          - {$ref: "#/components/parameters/ID"}
        responses:
          "200": {$ref: "#/components/responses/JSON"}
          "400": {$ref: "#/components/responses/Error"}
          "404": {$ref: "#/components/responses/Error"}
    AlertState:
      post:
        tags: [Administration]
        summary: Change anomaly lifecycle state
        parameters:
          - {$ref: "#/components/parameters/ID"}
        responses:
          "200": {$ref: "#/components/responses/JSON"}
          "404": {$ref: "#/components/responses/Error"}
  schemas:
    Health:
      type: object
      required: [ok, time, version, uptime_sec, nodes, database, redis]
      properties:
        ok: {type: boolean}
        time: {type: string, format: date-time}
